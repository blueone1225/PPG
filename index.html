<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>遺忘之劍 - 核心機制版</title>
    <style>
        body { font-family: monospace; background: #0c0d12; color: #d0d0d0; padding: 20px; }
        .card { background: #161822; border: 1px solid #33374d; padding: 15px; margin-bottom: 15px; border-radius: 4px; }
        button { background: #282c40; color: #fff; border: 1px solid #4a5070; padding: 8px 12px; cursor: pointer; margin-right: 5px; margin-bottom: 5px; }
        button:hover { background: #3d4363; }
        .log { background: #08080c; border: 1px solid #222533; height: 250px; overflow-y: auto; padding: 10px; font-size: 13px; line-height: 1.5; }
        .txt-gold { color: #f1c40f; } .txt-red { color: #e74c3c; } .txt-blue { color: #3498db; } .txt-green { color: #2ecc71; }
    </style>
</head>
<body>

<h1>⚔️ 遺忘之劍 - 機制模擬</h1>

<!-- 角色屬性 -->
<div class="card">
    <h3>英雄狀態 (Hero Status)</h3>
    <p>血量: <span id="p-hp" class="txt-red">200/200</span> | 耐力值 (Stamina): <span id="p-sta" class="txt-blue">100/100</span></p>
    <p>基礎攻擊: <span id="p-atk">20</span> | 敏捷(攻速): <span id="p-spd">15</span> | 暴擊率: <span id="p-crit">5%</span></p>
    <p>當前武器: <strong id="eq-name" class="txt-gold">無</strong></p>
    <p id="eq-stats">屬性加成: 無</p>
    <p id="eq-affix" class="txt-green">特殊詞條: 無</p>
    <button onclick="craftEquipment()">🔨 鍛造裝備 (隨機詞條與階級)</button>
</div>

<!-- 戰鬥目標 -->
<div class="card">
    <h3>選擇關卡怪物 (Select Stage)</h3>
    <button onclick="startBattle('small')">［小試身手］哥布林偵查兵 (風屬性)</button>
    <button onclick="startBattle('medium')">［中級考驗］岩石巨人 (地屬性)</button>
    <button onclick="startBattle('big')">［BOSS 戰］煉獄魔龍 (火屬性)</button>
</div>

<!-- 戰鬥 Log -->
<div class="card">
    <h3>戰鬥演算數據 (Combat Calculation Log)</h3>
    <div class="log" id="log">點擊鍛造裝備或選擇怪物開始戰鬥...<br></div>
</div>

<script>
    // 玩家主體數據
    let hero = {
        maxHp: 200, hp: 200,
        maxSta: 100, sta: 100,
        baseAtk: 20, speed: 15, critRate: 0.05,
        element: "無", equip: null
    };

    // 《遺忘之劍》風格：詞條資料庫 (正負面與特殊機制)
    const affixPool = [
        { name: "狂暴 (暴擊率+20%，但每回合扣除 5% 現有生命)", type: "berserk", critBonus: 0.2, selfBleed: 0.05 },
        { name: "破甲 (攻擊有 30% 機率直接削減目標 30 點耐力)", type: "armorBreak", breakBonus: 30 },
        { name: "吸血詛咒 (造成傷害的 20% 轉為吸血，但受到傷害+15%)", type: "vamp", lifesteal: 0.2, dmgTakeBonus: 0.15 },
        { name: "疾風 (敏捷+10，攻擊時 25% 機率觸發第二次連擊)", type: "wind", spdBonus: 10, doubleHit: 0.25 },
        { name: "劇毒刃 (攻擊時 25% 機率使目標陷入中殘毒)", type: "poison", poisonChance: 0.25 }
    ];

    // 裝備生成器
    function craftEquipment() {
        const tiers = [
            { tier: "破舊", mult: 0.8, color: "#95a5a6" },
            { tier: "精鋼", mult: 1.5, color: "#3498db" },
            { tier: "遺忘傳承", mult: 2.8, color: "#f1c40f" }
        ];
        const elements = ["火", "水", "風", "地"];
        
        let t = tiers[Math.floor(Math.random() * tiers.length)];
        let elem = elements[Math.floor(Math.random() * elements.length)];
        
        let atkVal = Math.floor((Math.random() * 10 + 10) * t.mult);
        let spdVal = Math.floor((Math.random() * 5 + 2) * t.mult);
        
        // 25% 觸發特殊詞條
        let affix = Math.random() < 0.25 ? affixPool[Math.floor(Math.random() * affixPool.length)] : null;

        hero.equip = {
            name: `${t.tier}的${elem}屬性長劍`,
            tier: t.tier, color: t.color, element: elem,
            atk: atkVal, speed: spdVal, affix: affix
        };

        // UI 數據更新
        document.getElementById('eq-name').innerText = hero.equip.name;
        document.getElementById('eq-name').style.color = hero.equip.color;
        document.getElementById('eq-stats').innerText = `攻擊 +${atkVal} | 敏捷 +${spdVal} | 屬性: ${elem}`;
        document.getElementById('eq-affix').innerText = affix ? `詞條: ${affix.name}` : "詞條: 無 (普通裝備)";

        log(`🔨 成功鍛造出 <span style="color:${t.color}">[${hero.equip.name}]</span>！`);
    }

    // 怪物數據庫
    const monsters = {
        small: { name: "哥布林偵查兵", hp: 120, maxHp: 120, sta: 40, maxSta: 40, atk: 15, speed: 12, element: "風" },
        medium: { name: "岩石巨人", hp: 300, maxHp: 300, sta: 100, maxSta: 100, atk: 28, speed: 8, element: "地" },
        big: { name: "煉獄魔龍", hp: 650, maxHp: 650, sta: 180, maxSta: 180, atk: 45, speed: 18, element: "火" }
    };

    // 屬性相剋判定 (火 -> 風 -> 地 -> 水 -> 火)
    function getElementMultiplier(attElem, defElem) {
        if (!attElem || !defElem || attElem === "無") return 1.0;
        if (attElem === "火" && defElem === "風") return 1.3;
        if (attElem === "風" && defElem === "地") return 1.3;
        if (attElem === "地" && defElem === "水") return 1.3;
        if (attElem === "水" && defElem === "火") return 1.3;
        
        if (attElem === "風" && defElem === "火") return 0.7;
        if (attElem === "地" && defElem === "風") return 0.7;
        if (attElem === "水" && defElem === "地") return 0.7;
        if (attElem === "火" && defElem === "水") return 0.7;
        return 1.0;
    }

    // 戰鬥的核心演算引擎
    function startBattle(diff) {
        let m = JSON.parse(JSON.stringify(monsters[diff]));
        hero.hp = hero.maxHp;
        hero.sta = hero.maxSta;

        log(`--------------------------------------------------`);
        log(`⚔️ 戰鬥開始！對抗 <strong class="txt-red">${m.name}</strong> (${m.element}屬性)`);

        let eq = hero.equip || { atk: 0, speed: 0, element: "無", affix: null };
        let totalAtk = hero.baseAtk + eq.atk;
        let totalSpeed = hero.speed + eq.speed + (eq.affix?.spdBonus || 0);
        let critRate = hero.critRate + (eq.affix?.critBonus || 0);

        let mPoisonStacks = 0;
        let round = 1;

        while (hero.hp > 0 && m.hp > 0) {
            log(`<br><strong>[ Round ${round} ]</strong>`);

            // 1. 回合開始前的 Debuff 結算
            if (eq.affix?.type === "berserk") {
                let selfDmg = Math.floor(hero.hp * eq.affix.selfBleed);
                hero.hp -= selfDmg;
                log(`<span class="txt-red">🩸 狂暴反噬：你失去了 ${selfDmg} 生命值。</span>`);
            }

            if (mPoisonStacks > 0) {
                let pDmg = mPoisonStacks * 12;
                m.hp -= pDmg;
                log(`<span class="txt-green">🤢 劇毒發作：${m.name} 受到 ${pDmg} 點毒性傷害 (層數: ${mPoisonStacks})。</span>`);
            }

            if (m.hp <= 0) { log(victoryLog(m.name)); break; }
            if (hero.hp <= 0) { log(defeatLog(m.name)); break; }

            // 2. 順序判定
            let heroFirst = totalSpeed >= m.speed;
            
            if (heroFirst) {
                playerAttackPhase();
                if (m.hp > 0) monsterAttackPhase();
            } else {
                monsterAttackPhase();
                if (hero.hp > 0) playerAttackPhase();
            }

            // 3. 回合結束耐力恢復
            if (m.sta < m.maxSta) m.sta = Math.min(m.maxSta, m.sta + 5);

            round++;
            if (round > 25) { log("⌛ 戰鬥逾時，雙方體力耗盡平手。"); break; }
        }

        updateUI();

        function playerAttackPhase() {
            let isBreak = m.sta <= 0;
            let mult = getElementMultiplier(eq.element, m.element);
            
            if (isBreak) mult *= 1.5;

            let isCrit = Math.random() < critRate;
            let dmg = Math.floor(totalAtk * mult * (isCrit ? 1.8 : 1.0));

            m.hp -= dmg;
            m.sta = Math.max(0, m.sta - 15);

            let hitMsg = `<span class="txt-blue">你</span> 對 ${m.name} 造成 <b>${dmg}</b> 點傷害 ${isCrit ? '<strong class="txt-gold">(暴擊!)</strong>' : ''}`;
            if (mult > 1.0) hitMsg += ` <span class="txt-green">(屬性克制)</span>`;
            log(hitMsg);

            if (eq.affix?.type === "armorBreak" && Math.random() < 0.3) {
                m.sta = Math.max(0, m.sta - eq.affix.breakBonus);
                log(`<span class="txt-gold">⚡ 觸發破甲：削減了 ${m.name} ${eq.affix.breakBonus} 點耐力！</span>`);
            }

            if (m.sta === 0 && !isBreak) {
                log(`<span class="txt-gold">💥 BREAK！${m.name} 的姿態被打破，進入癱瘓狀態！</span>`);
            }

            if (eq.affix?.type === "vamp") {
                let heal = Math.floor(dmg * eq.affix.lifesteal);
                hero.hp = Math.min(hero.maxHp, hero.hp + heal);
                log(`<span class="txt-green">🩸 吸血恢復了 ${heal} HP</span>`);
            }

            if (eq.affix?.type === "poison" && Math.random() < eq.affix.poisonChance) {
                mPoisonStacks++;
                log(`<span class="txt-green">🧪 成功施加中毒狀態！</span>`);
            }

            if (eq.affix?.type === "wind" && Math.random() < eq.affix.doubleHit) {
                let extraDmg = Math.floor(dmg * 0.6);
                m.hp -= extraDmg;
                log(`<span class="txt-blue">🌀 觸發疾風連擊！追加造成 ${extraDmg} 點傷害。</span>`);
            }
        }

        function monsterAttackPhase() {
            if (m.sta <= 0) {
                log(`<span class="txt-gold">💫 ${m.name} 處於破防癱瘓中，無法行動！</span>`);
                return;
            }

            let mult = getElementMultiplier(m.element, eq.element);
            let dmg = Math.floor(m.atk * mult);

            if (eq.affix?.type === "vamp") dmg = Math.floor(dmg * (1 + eq.affix.dmgTakeBonus));

            hero.hp -= dmg;
            log(`<span class="txt-red">${m.name}</span> 對你造成 <b>${dmg}</b> 點傷害。`);
        }
    }

    function victoryLog(name) { return `<br><span class="txt-green">🎉 戰鬥勝利！你討伐了 ${name}。</span>`; }
    function defeatLog(name) { return `<br><span class="txt-red">💀 眼前一黑... 你被 ${name} 擊敗了。</span>`; }

    function updateUI() {
        document.getElementById('p-hp').innerText = `${Math.max(0, hero.hp)} / ${hero.maxHp}`;
        document.getElementById('p-sta').innerText = `${Math.max(0, hero.sta)} / ${hero.maxSta}`;
    }

    function log(msg) {
        const l = document.getElementById('log');
        l.innerHTML += msg + "<br>";
        l.scrollTop = l.scrollHeight;
    }
</script>

</body>
</html>

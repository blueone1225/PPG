<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>遺忘之劍 - 上傳圖片輪播版</title>
    <style>
        :root {
            --bg-dark: rgba(18, 16, 23, 0.92);
            --border-gold: rgba(212, 175, 55, 0.5);
            --gold-light: #f3d17c;
            --text-gray: #a0a0b0;
            --red-dot: #ff4757;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-size: cover;
            background-position: center;
            transition: background-image 0.8s ease-in-out;
        }

        .game-screen {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: row;
            position: relative;
            background: rgba(0, 0, 0, 0.4);
        }

        /* 左側戰鬥區域 */
        .battle-overlay {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 15px;
            height: 100%;
        }

        /* ----- 紅圈區塊：圖片輪播容器 ----- */
        .carousel-box {
            position: relative;
            flex: 1;
            background: rgba(12, 13, 18, 0.88);
            border: 1px solid var(--border-gold);
            border-radius: 12px;
            overflow: hidden;
            backdrop-filter: blur(10px);
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
        }

        /* 輪播圖片顯示區 */
        .carousel-slider {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .carousel-slide {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
            background-size: cover;
            background-position: center;
        }

        .carousel-slide.active {
            opacity: 1;
        }

        /* 控制按鈕 (左右箭頭) */
        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            border: 1px solid var(--border-gold);
            border-radius: 50%;
            width: 36px; height: 36px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            z-index: 5;
            transition: all 0.2s;
        }
        .carousel-btn:hover { background: rgba(212, 175, 55, 0.8); color: #000; }
        .carousel-btn.prev { left: 10px; }
        .carousel-btn.next { right: 10px; }

        /* 上傳按鈕工具列 */
        .carousel-tools {
            position: absolute;
            top: 10px; right: 10px;
            z-index: 6;
            display: flex; gap: 8px;
        }

        .upload-btn {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--gold-light);
            color: var(--gold-light);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: all 0.2s;
            display: flex; align-items: center; gap: 4px;
        }

        .upload-btn:hover {
            background: var(--gold-light);
            color: #000;
        }

        /* 輪播點指示器 */
        .carousel-dots {
            position: absolute;
            bottom: 85px; left: 50%;
            transform: translateX(-50%);
            display: flex; gap: 6px;
            z-index: 5;
        }

        .dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            transition: all 0.3s;
        }

        .dot.active {
            background: var(--gold-light);
            width: 20px;
            border-radius: 4px;
        }

        /* 浮動日誌訊息區 */
        .log-overlay {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 80px;
            background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(12, 13, 18, 0.95) 100%);
            border-top: 1px solid rgba(212, 175, 55, 0.3);
            padding: 8px 12px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.8rem;
            line-height: 1.5;
            z-index: 5;
        }

        /* ----- 技能列 ----- */
        .skills-bar {
            background: rgba(18, 16, 23, 0.95);
            border: 1px solid var(--border-gold);
            border-radius: 12px;
            padding: 10px;
            display: flex;
            gap: 8px;
            justify-content: space-around;
        }

        .skill-btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 8px;
            color: #fff;
            padding: 8px 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }

        .skill-btn:hover:not(:disabled) { background: rgba(212, 175, 55, 0.2); border-color: var(--gold-light); }
        .skill-btn:disabled { opacity: 0.3; cursor: not-allowed; filter: grayscale(1); }

        .skill-icon { font-size: 1.2rem; }
        .skill-name { font-size: 0.75rem; margin-top: 2px; }
        .skill-cost { font-size: 0.65rem; color: #1e90ff; }
        
        .cooldown-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85); color: var(--gold-light);
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 1rem;
        }

        /* 右側主選單 */
        .menu-modal {
            width: 420px;
            height: 100%;
            background: var(--bg-dark);
            backdrop-filter: blur(12px);
            border-left: 1px solid var(--border-gold);
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 10;
        }

        .profile-header {
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            background: linear-gradient(180deg, rgba(212, 175, 55, 0.15) 0%, rgba(0,0,0,0) 100%);
        }

        .avatar-box {
            width: 50px; height: 50px;
            border-radius: 50%;
            border: 2px solid var(--gold-light);
            background: #3d354b;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem;
        }

        .player-info { flex: 1; }
        .player-name { font-size: 1rem; font-weight: bold; color: #fff; }
        .player-id { font-size: 0.7rem; color: var(--gold-light); margin-top: 2px; display: flex; align-items: center; gap: 5px; }
        .edit-id-btn { cursor: pointer; font-size: 0.65rem; color: #aaa; text-decoration: underline; }
        .edit-id-btn:hover { color: #fff; }
        .player-stats { font-size: 0.75rem; color: #7bed9f; margin-top: 2px; }
        .player-sub { font-size: 0.7rem; color: var(--text-gray); margin-top: 2px; }

        .grid-container {
            flex: 1;
            padding: 15px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 10px;
            overflow-y: auto;
        }

        .grid-item {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px; cursor: pointer; transition: all 0.2s ease; position: relative;
        }

        .grid-item:hover:not(.locked) { background: rgba(212, 175, 55, 0.15); border-color: var(--gold-light); }
        .grid-item .icon { font-size: 1.5rem; margin-bottom: 4px; }
        .grid-item .label { font-size: 0.7rem; color: #ddd; text-align: center; }
        .grid-item.locked { opacity: 0.35; cursor: not-allowed; }
        .grid-item.locked::after { content: '🔒'; position: absolute; font-size: 0.7rem; bottom: 4px; right: 4px; }
        .badge { position: absolute; top: 4px; right: 6px; width: 6px; height: 6px; background-color: var(--red-dot); border-radius: 50%; }

        .modal-popup {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(18, 16, 23, 0.98); z-index: 20; display: none;
            flex-direction: column; padding: 20px;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-gold); padding-bottom: 10px; margin-bottom: 15px; }
        .modal-title { font-size: 1rem; color: var(--gold-light); font-weight: bold; }
        .close-btn { cursor: pointer; font-size: 1.2rem; color: #888; }
        .close-btn:hover { color: #fff; }

        .inventory-grid, .shop-grid { display: grid; grid-template-columns: repeat(1, 1fr); gap: 10px; overflow-y: auto; flex: 1; }
        .inv-item, .shop-item { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; justify-content: space-between; }
        .inv-item.equipped { border-color: #2ed573; background: rgba(46,213,115,0.12); }
        .trait-tag { color: #eccc68; font-size: 0.7rem; margin-top: 3px; font-weight: bold; }

        .sidebar-right {
            width: 50px; height: 100%;
            background: rgba(10, 8, 14, 0.95);
            border-left: 1px solid rgba(255,255,255,0.05);
            display: flex; flex-direction: column; align-items: center; padding-top: 20px; gap: 20px;
        }
        .sidebar-icon { font-size: 1.1rem; color: #777; cursor: pointer; }
        .sidebar-icon:hover { color: var(--gold-light); }

        .txt-gold { color: var(--gold-light); }
        .txt-red { color: #ff4757; }
        .txt-blue { color: #1e90ff; }
        .txt-green { color: #2ed573; }
        .txt-purple { color: #a55eea; }
        .txt-gray { color: #888; }

        @media (max-width: 820px) {
            .game-screen { flex-direction: column-reverse; overflow-y: auto; }
            .menu-modal { width: 100vw; height: auto; border-left: none; border-top: 1px solid var(--border-gold); }
            .sidebar-right { display: none; }
            .battle-overlay { height: 420px; padding: 10px; }
            .grid-container { grid-template-columns: repeat(4, 1fr); height: 260px; }
            .skills-bar { padding: 6px; gap: 4px; }
            .skill-name { font-size: 0.65rem; }
        }
    </style>
</head>
<body>

<div class="game-screen">

    <!-- 左側：圖片輪播 + 戰鬥日誌 + 技能 -->
    <div class="battle-overlay">
        
        <!-- 紅圈區域：輪播圖片機制 -->
        <div class="carousel-box">
            <!-- 工具列：上傳按鈕 -->
            <div class="carousel-tools">
                <label class="upload-btn">
                    📷 上傳圖片
                    <input type="file" id="image-uploader" accept="image/*" style="display:none;" onchange="handleImageUpload(event)">
                </label>
            </div>

            <!-- 輪播圖片容器 -->
            <div class="carousel-slider" id="carousel-slider"></div>

            <!-- 控制按鈕 -->
            <div class="carousel-btn prev" onclick="prevSlide()">❮</div>
            <div class="carousel-btn next" onclick="nextSlide()">❯</div>

            <!-- 指示點 -->
            <div class="carousel-dots" id="carousel-dots"></div>

            <!-- 浮動戰鬥日誌 -->
            <div class="log-overlay" id="log">
                <span class="txt-gold">［系統］</span> 上傳圖片輪播機制已啟用！點擊右上角「上傳圖片」可自由新增展示圖。<br>
            </div>
        </div>

        <!-- 技能列 -->
        <div class="skills-bar">
            <button class="skill-btn" id="sk-0" onclick="useSkill(0)">
                <span class="skill-icon">🔥</span><span class="skill-name">烈焰焚身</span><span class="skill-cost">20 STA</span>
                <div class="cooldown-overlay" id="cd-0" style="display:none;">0</div>
            </button>
            <button class="skill-btn" id="sk-1" onclick="useSkill(1)">
                <span class="skill-icon">🛡️</span><span class="skill-name">聖光護盾</span><span class="skill-cost">25 STA</span>
                <div class="cooldown-overlay" id="cd-1" style="display:none;">0</div>
            </button>
            <button class="skill-btn" id="sk-2" onclick="useSkill(2)">
                <span class="skill-icon">🌀</span><span class="skill-name">疾風三連擊</span><span class="skill-cost">30 STA</span>
                <div class="cooldown-overlay" id="cd-2" style="display:none;">0</div>
            </button>
            <button class="skill-btn" id="sk-3" onclick="useSkill(3)">
                <span class="skill-icon">🗡️</span><span class="skill-name">重創破防</span><span class="skill-cost">35 STA</span>
                <div class="cooldown-overlay" id="cd-3" style="display:none;">0</div>
            </button>
            <button class="skill-btn" id="sk-4" onclick="useSkill(4)">
                <span class="skill-icon">🩸</span><span class="skill-name">血氣爆發</span><span class="skill-cost">40 STA</span>
                <div class="cooldown-overlay" id="cd-4" style="display:none;">0</div>
            </button>
        </div>
    </div>

    <!-- 右側：主選單 -->
    <div class="menu-modal">
        <div class="profile-header">
            <div class="avatar-box">🗡️</div>
            <div class="player-info">

 <span id="p-username"> chrome瀏覽x手機遊玩橫向 </span> 
    <span class="txt-gold" id="p-level">Lv.1</span>
                
                <div class="player-id">
                    <span id="p-custom-id">玩家編號：#884920</span>
                    <span class="edit-id-btn" onclick="changePlayerID()">[修改]</span>
                </div>
                <div class="player-stats" id="p-hp-sta">HP: 200/200 | STA: 100/100</div>
                <div class="player-sub" id="p-exp-gold">EXP: 0/100 | 金幣: 200G | 關卡: 1-1</div>
            </div>
        </div>

        <div class="grid-container">
            <div class="grid-item" onclick="craftEquipment()">
                <div class="badge"></div><div class="icon">🔨</div><div class="label">鍛造裝備</div>
            </div>
            <div class="grid-item" onclick="openInventory()">
                <div class="icon">🎒</div><div class="label">背包與裝備</div>
            </div>
            <div class="grid-item" onclick="openShop()">
                <div class="badge"></div><div class="icon">🏪</div><div class="label">金幣商店</div>
            </div>
            <div class="grid-item" onclick="startStageBattle()">
                <div class="badge"></div><div class="icon">⚔️</div><div class="label">關卡挑戰</div>
            </div>
            <div class="grid-item" onclick="startBossBattle()">
                <div class="badge"></div><div class="icon">🐉</div><div class="label">首領討伐</div>
            </div>
            <div class="grid-item" onclick="changeRandomBackground()">
                <div class="icon">🖼️</div><div class="label">換隨機背景</div>
            </div>

            <div class="grid-item locked"><div class="icon">🐾</div><div class="label">寵物</div></div>
            <div class="grid-item locked"><div class="icon">✨</div><div class="label">成長</div></div>
            <div class="grid-item locked"><div class="icon">🏆</div><div class="label">聖物</div></div>
            <div class="grid-item locked"><div class="icon">🎲</div><div class="label">魔方</div></div>
            <div class="grid-item locked"><div class="icon">⚒️</div><div class="label">製作</div></div>
            <div class="grid-item locked"><div class="icon">⛩️</div><div class="label">試煉</div></div>
            <div class="grid-item locked"><div class="icon">📜</div><div class="label">圖鑑</div></div>
            <div class="grid-item locked"><div class="icon">📊</div><div class="label">排名</div></div>
            <div class="grid-item locked"><div class="icon">🛡️</div><div class="label">公會</div></div>
            <div class="grid-item locked"><div class="icon">⚙️</div><div class="label">設定</div></div>
        </div>

        <!-- 背包視窗 -->
        <div class="modal-popup" id="inventory-modal">
            <div class="modal-header">
                <div class="modal-title">🎒 角色背包 (包含特殊裝備特性)</div>
                <div class="close-btn" onclick="closeModal('inventory-modal')">✖</div>
            </div>
            <div class="inventory-grid" id="inv-list"></div>
        </div>

        <!-- 商店視窗 -->
        <div class="modal-popup" id="shop-modal">
            <div class="modal-header">
                <div class="modal-title">🏪 金幣道具商店</div>
                <div class="close-btn" onclick="closeModal('shop-modal')">✖</div>
            </div>
            <div class="shop-grid" id="shop-list"></div>
        </div>
    </div>

    <div class="sidebar-right">
        <div class="sidebar-icon" onclick="changeRandomBackground()" title="換隨機桌布">🖼️</div>
        <div class="sidebar-icon">🔒</div>
        <div class="sidebar-icon">⚡</div>
        <div class="sidebar-icon">⚙️</div>
    </div>

</div>

<script>
    // ------------------- 輪播圖片機制 -------------------
    let carouselImages = [
        "https://i.imgur.com/qmaAfG9.jpg", // 暗黑餐桌
        "https://image.tw.ncsoft.com/lostsword/upload/news/202602/0213_Callabo.jpg", //閃
        "https://image.tw.ncsoft.com/lostsword/upload/news/202602/HIKAGE_Die(NEW).gif",
        "https://i.meee.com.tw/4iU75Fz.gif",
        "https://i.meee.com.tw/3p2bGZ4.gif",
        "https://i.meee.com.tw/uoQxiPq.gif",
        "https://i.meee.com.tw/XPt3nBv.gif",
        "https://cdn2.ettoday.net/images/1244/d1244346.gif" //x06火
    
    ];
    let currentSlide = 0;
    let carouselInterval = null;

    function renderCarousel() {
        const slider = document.getElementById('carousel-slider');
        const dotsContainer = document.getElementById('carousel-dots');
        slider.innerHTML = '';
        dotsContainer.innerHTML = '';

        carouselImages.forEach((imgUrl, index) => {
            // 建立 Slide
            const slide = document.createElement('div');
            slide.className = `carousel-slide ${index === currentSlide ? 'active' : ''}`;
            slide.style.backgroundImage = `url('${imgUrl}')`;
            slider.appendChild(slide);

            // 建立 Dot
            const dot = document.createElement('div');
            dot.className = `dot ${index === currentSlide ? 'active' : ''}`;
            dot.onclick = () => goToSlide(index);
            dotsContainer.appendChild(dot);
        });
    }

    function showSlide(index) {
        if (index < 0) currentSlide = carouselImages.length - 1;
        else if (index >= carouselImages.length) currentSlide = 0;
        else currentSlide = index;

        renderCarousel();
        resetCarouselTimer();
    }

    function nextSlide() { showSlide(currentSlide + 1); }
    function prevSlide() { showSlide(currentSlide - 1); }
    function goToSlide(index) { showSlide(index); }

    function resetCarouselTimer() {
        if (carouselInterval) clearInterval(carouselInterval);
        carouselInterval = setInterval(nextSlide, 3500); // 3.5秒自動輪播
    }

    // 上傳本地圖片處理
    function handleImageUpload(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const imageUrl = e.target.result;
                carouselImages.push(imageUrl);
                currentSlide = carouselImages.length - 1; // 自動切換到最新圖片
                renderCarousel();
                log(`<span class="txt-green">🖼️ 圖片上傳成功！已新增至輪播圖庫紙。</span>`);
            };
            reader.readAsDataURL(file);
        }
    }

    // ------------------- 桌布背景切換 -------------------
    const bgImages = [
        "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1600&auto=format&fit=crop",
        "https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?q=80&w=1600&auto=format&fit=crop",
        "https://images.unsplash.com/photo-1519681393784-d120267933ba?q=80&w=1600&auto=format&fit=crop",
        "https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=1600&auto=format&fit=crop"
    ];

    function changeRandomBackground() {
        let randomImg = bgImages[Math.floor(Math.random() * bgImages.length)];
        document.body.style.backgroundImage = `url('${randomImg}')`;
        log(`<span class="txt-gold">🖼️ 已切換隨機背景圖！</span>`);
    }

    // ------------------- 遊戲角色與邏輯 -------------------
    let playerId = "884920";
    function changePlayerID() {
        let newId = prompt("請輸入您的新專屬編號（最多6位數字或字母）：", playerId);
        if (newId !== null && newId.trim() !== "") {
            playerId = newId.trim().substring(0, 6);
            document.getElementById('p-custom-id').innerText = `玩家編號：#${playerId}`;
            log(`<span class="txt-green">✏️ 專屬編號已更新為：#${playerId}</span>`);
        }
    }

    const weaponTraits = [
        { id: "vampire", name: "【特性：嗜血吸魂】", desc: "普通攻擊時附帶 15% 吸血效果", code: "vamp" },
        { id: "flame", name: "【特性：熾熱烈焰】", desc: "攻擊時有 30% 機率直接讓敵人進入灼燒狀態", code: "burn" },
        { id: "pierce", name: "【特性：貫穿破甲】", desc: "若敵人處於破防狀態，造成額外 50% 傷害", code: "pierce" },
        { id: "shield", name: "【特性：堅守庇護】", desc: "回合開始時有 20% 機率自動獲得 40 點護盾", code: "shield" },
        { id: "haste", name: "【特性：疾風迅捷】", desc: "技能冷卻時間減少 1 回合", code: "haste" }
    ];

    let hero = {
        level: 1, exp: 0, maxExp: 100, gold: 200,
        maxHp: 200, hp: 200,
        maxSta: 100, sta: 100,
        baseAtk: 25, critRate: 0.15,
        shield: 0, buffAtk: 0,
        equippedWeapon: null,
        inventory: []
    };

    let stage = { chapter: 1, node: 1 };

    const skills = [
        { id: 0, name: "烈焰焚身", cost: 20, cd: 3, currentCd: 0 },
        { id: 1, name: "聖光護盾", cost: 25, cd: 4, currentCd: 0 },
        { id: 2, name: "疾風三連擊", cost: 30, cd: 3, currentCd: 0 },
        { id: 3, name: "重創破防", cost: 35, cd: 4, currentCd: 0 },
        { id: 4, name: "血氣爆發", cost: 40, cd: 5, currentCd: 0 }
    ];

    const shopItems = [
        { id: 'p_hp', name: '大生命藥水', price: 50, desc: '恢復 100 點生命值', type: 'heal_hp' },
        { id: 'p_sta', name: '大活力藥水', price: 50, desc: '恢復 50 點耐力值 (STA)', type: 'heal_sta' },
        { id: 'buff_atk', name: '力量藥劑', price: 150, desc: '永久增加 5 點基礎攻擊力', type: 'perm_atk' },
        { id: 'buff_hp', name: '體魄強化藥劑', price: 150, desc: '永久增加 30 點最大血量', type: 'perm_hp' }
    ];

    let currentMonster = null;
    let battleTimer = null;
    let inBattle = false;

    function craftEquipment() {
        if (hero.inventory.length >= 8) {
            log(`<span class="txt-red">⚠️ 背包空間不足（上限 8 個）！請先出售多餘裝備。</span>`);
            return;
        }

        const tiers = [
            { tier: "破舊", mult: 1.0, color: "#95a5a6", crit: 0.02 },
            { tier: "精鋼", mult: 1.8, color: "#3498db", crit: 0.05 },
            { tier: "傳承", mult: 3.0, color: "#f1c40f", crit: 0.10 }
        ];
        const elements = ["火", "水", "風", "雷"];
        
        let t = tiers[Math.floor(Math.random() * tiers.length)];
        let elem = elements[Math.floor(Math.random() * elements.length)];
        let atkVal = Math.floor((Math.random() * 10 + 10) * t.mult);
        let critVal = t.crit;
        let trait = weaponTraits[Math.floor(Math.random() * weaponTraits.length)];

        let item = {
            id: Date.now(),
            name: `${t.tier}的${elem}屬性長劍`,
            color: t.color, element: elem, atk: atkVal, crit: critVal,
            trait: trait
        };

        hero.inventory.push(item);
        log(`🔨 成功打造 <span style="color:${item.color}">[${item.name}]</span>！<br>&nbsp;&nbsp;↳ 屬性: 攻擊+${atkVal}, 暴擊+${Math.round(critVal*100)}%<br>&nbsp;&nbsp;↳ <span class="txt-gold">${trait.name} ${trait.desc}</span>`);
        updateUI();
    }

    function openShop() {
        let shopList = document.getElementById('shop-list');
        shopList.innerHTML = '';
        shopItems.forEach(item => {
            let div = document.createElement('div');
            div.className = 'shop-item';
            div.innerHTML = `
                <div>
                    <div style="color:var(--gold-light); font-weight:bold; font-size:0.85rem;">${item.name}</div>
                    <div style="font-size:0.7rem; color:#aaa; margin-top:4px;">${item.desc}</div>
                </div>
                <div style="margin-top:10px; display:flex; justify-content:space-between; align-items:center;">
                    <span class="txt-gold" style="font-size:0.8rem; font-weight:bold;">${item.price} G</span>
                    <button onclick="buyShopItem('${item.id}')" style="font-size:0.7rem; padding:4px 8px; background:#2ed573; color:#fff; border:none; border-radius:4px; cursor:pointer;">購買</button>
                </div>
            `;
            shopList.appendChild(div);
        });
        document.getElementById('shop-modal').style.display = 'flex';
    }

    function buyShopItem(itemId) {
        let item = shopItems.find(i => i.id === itemId);
        if (!item) return;
        if (hero.gold < item.price) {
            log(`<span class="txt-red">⚠️ 金幣不足，無法購買 ${item.name}！</span>`);
            return;
        }
        hero.gold -= item.price;
        if (item.type === 'heal_hp') { hero.hp = Math.min(hero.maxHp, hero.hp + 100); log(`<span class="txt-green">🧪 使用了 ${item.name}，恢復 100 生命值！</span>`); }
        else if (item.type === 'heal_sta') { hero.sta = Math.min(hero.maxSta, hero.sta + 50); log(`<span class="txt-blue">🧪 使用了 ${item.name}，恢復 50 STA！</span>`); }
        else if (item.type === 'perm_atk') { hero.baseAtk += 5; log(`<span class="txt-gold">💪 使用了 ${item.name}，基礎攻擊力 +5！</span>`); }
        else if (item.type === 'perm_hp') { hero.maxHp += 30; hero.hp += 30; log(`<span class="txt-gold">❤️ 使用了 ${item.name}，最大生命值 +30！</span>`); }
        updateUI();
    }

    function openInventory() {
        let invList = document.getElementById('inv-list');
        invList.innerHTML = '';
        if (hero.inventory.length === 0) {
            invList.innerHTML = '<div style="text-align:center; color:#777; padding-top:40px;">背包空空如也，快去鍛造裝備吧！</div>';
        } else {
            hero.inventory.forEach(item => {
                let isEquipped = hero.equippedWeapon && hero.equippedWeapon.id === item.id;
                let div = document.createElement('div');
                div.className = `inv-item ${isEquipped ? 'equipped' : ''}`;
                div.innerHTML = `
                    <div>
                        <div style="color:${item.color}; font-weight:bold; font-size:0.85rem;">${item.name} ${isEquipped ? '［已裝備］' : ''}</div>
                        <div style="font-size:0.75rem; color:#ccc; margin-top:3px;">基礎屬性：攻擊 +${item.atk} | 暴擊 +${Math.round(item.crit*100)}%</div>
                        <div class="trait-tag">${item.trait.name}：${item.trait.desc}</div>
                    </div>
                    <div style="margin-top:8px; display:flex; gap:6px;">
                        <button onclick="equipItem(${item.id})" style="flex:1; font-size:0.7rem; padding:5px; cursor:pointer;">${isEquipped ? '卸下' : '穿上裝備'}</button>
                        <button onclick="sellItem(${item.id})" style="font-size:0.7rem; padding:5px; background:#ff4757; color:#fff; border:none; border-radius:3px; cursor:pointer;">出售</button>
                    </div>
                `;
                invList.appendChild(div);
            });
        }
        document.getElementById('inventory-modal').style.display = 'flex';
    }

    function closeModal(modalId) { document.getElementById(modalId).style.display = 'none'; }

    function equipItem(id) {
        if (hero.equippedWeapon && hero.equippedWeapon.id === id) {
            hero.equippedWeapon = null;
            log(`🛡️ 已卸下裝備。`);
        } else {
            let item = hero.inventory.find(i => i.id === id);
            if (item) {
                hero.equippedWeapon = item;
                log(`⚔️ 成功裝備了 <span style="color:${item.color}">[${item.name}]</span>！<br>&nbsp;&nbsp;↳ 激活效果：<span class="txt-gold">${item.trait.name}</span>`);
            }
        }
        updateUI();
        openInventory();
    }

    function sellItem(id) {
        let index = hero.inventory.findIndex(i => i.id === id);
        if (index !== -1) {
            if (hero.equippedWeapon && hero.equippedWeapon.id === id) hero.equippedWeapon = null;
            hero.inventory.splice(index, 1);
            hero.gold += 60;
            log(`💰 出售裝備獲得 60 金幣！`);
            updateUI();
            openInventory();
        }
    }

    function startStageBattle() {
        if (inBattle) return;
        let mHp = 120 + stage.chapter * 60 + stage.node * 25;
        let mAtk = 18 + stage.chapter * 6 + stage.node * 3;
        startBattleProcess({ name: `關卡怪物 ${stage.chapter}-${stage.node}`, hp: mHp, maxHp: mHp, atk: mAtk, armorBreak: 0, burn: 0, isBoss: false });
    }

    function startBossBattle() {
        if (inBattle) return;
        let mHp = 500 + stage.chapter * 250;
        let mAtk = 40 + stage.chapter * 12;
        startBattleProcess({ name: `第 ${stage.chapter} 章首領 · 煉獄魔龍`, hp: mHp, maxHp: mHp, atk: mAtk, armorBreak: 0, burn: 0, isBoss: true });
    }

    function useSkill(skillIdx) {
        if (!inBattle || !currentMonster) return;
        let sk = skills[skillIdx];
        if (sk.currentCd > 0) { log(`<span class="txt-red">⚠️ ${sk.name} 尚在冷卻中（剩餘 ${sk.currentCd} 回合）</span>`); return; }
        if (hero.sta < sk.cost) { log(`<span class="txt-red">⚠️ 耐力不足（需 ${sk.cost} STA）</span>`); return; }

        hero.sta -= sk.cost;
        let cdReduce = (hero.equippedWeapon && hero.equippedWeapon.trait.code === "haste") ? 1 : 0;
        sk.currentCd = Math.max(1, sk.cd - cdReduce);
        updateSkillCDUI();

        let eqAtk = hero.equippedWeapon ? hero.equippedWeapon.atk : 0;
        let totalAtk = hero.baseAtk + eqAtk + hero.buffAtk;

        if (sk.id === 0) {
            let dmg = Math.floor(totalAtk * 1.5);
            currentMonster.hp -= dmg;
            currentMonster.burn = 2;
            log(`<span class="txt-red">🔥 施放【烈焰焚身】造成 ${dmg} 傷害，並附加［灼燒］狀態！</span>`);
        } else if (sk.id === 1) {
            hero.shield += 80;
            log(`<span class="txt-blue">🛡️ 施放【聖光護盾】，獲得 80 點護盾值！</span>`);
        } else if (sk.id === 2) {
            let totalDmg = Math.floor(totalAtk * 0.6) * 3;
            currentMonster.hp -= totalDmg;
            log(`<span class="txt-purple">🌀 施放【疾風三連擊】，爆發打擊造成 ${totalDmg} 傷害！</span>`);
        } else if (sk.id === 3) {
            let dmg = Math.floor(totalAtk * 1.2);
            currentMonster.hp -= dmg;
            currentMonster.armorBreak = 3;
            log(`<span class="txt-gold">🗡️ 施放【重創破防】！敵人陷入［破防］狀態 3 回合！</span>`);
        } else if (sk.id === 4) {
            let dmg = Math.floor(totalAtk * 1.6);
            let heal = Math.floor(dmg * 0.5);
            currentMonster.hp -= dmg;
            hero.hp = Math.min(hero.maxHp, hero.hp + heal);
            log(`<span class="txt-green">🩸 施放【血氣爆發】，造成 ${dmg} 傷害並吸取 ${heal} HP！</span>`);
        }

        updateUI();
        checkBattleStatus();
    }

    function startBattleProcess(m) {
        if (battleTimer) clearInterval(battleTimer);
        currentMonster = m;
        inBattle = true;
        hero.hp = hero.maxHp;
        hero.sta = hero.maxSta;
        hero.shield = 0;
        hero.buffAtk = 0;
        skills.forEach(s => s.currentCd = 0);
        updateSkillCDUI();
        updateUI();

        log(`--------------------------------------------------`);
        log(`⚔️ 戰鬥開始！挑戰 <strong class="txt-red">${m.name}</strong> (HP: ${m.hp})`);

        let round = 1;

        battleTimer = setInterval(() => {
            log(`<span class="txt-gray">--- [ 回合 ${round} ] ---</span>`);

            skills.forEach(s => { if (s.currentCd > 0) s.currentCd--; });
            updateSkillCDUI();

            hero.sta = Math.min(hero.maxSta, hero.sta + 15);

            if (hero.equippedWeapon && hero.equippedWeapon.trait.code === "shield" && Math.random() < 0.2) {
                hero.shield += 40;
                log(`<span class="txt-gold">✨ 觸發【堅守庇護】特性，自動產生 40 點護盾！</span>`);
            }

            if (m.burn > 0) {
                let burnDmg = 20;
                m.hp -= burnDmg;
                m.burn--;
                log(`<span class="txt-red">🔥 ${m.name} 受到灼燒傷害 <b>${burnDmg}</b> 點！</span>`);
                if (checkBattleStatus()) return;
            }

            let eqAtk = hero.equippedWeapon ? hero.equippedWeapon.atk : 0;
            let eqCrit = hero.equippedWeapon ? hero.equippedWeapon.crit : 0;
            let totalAtk = hero.baseAtk + eqAtk + hero.buffAtk;

            if (m.armorBreak > 0) {
                let extraMult = (hero.equippedWeapon && hero.equippedWeapon.trait.code === "pierce") ? 1.8 : 1.3;
                totalAtk = Math.floor(totalAtk * extraMult);
                m.armorBreak--;
                log(`<span class="txt-gold">⚠️ 破防打擊！傷害乘數提高至 ${Math.round(extraMult*100)}%！</span>`);
            }

            let isCrit = Math.random() < (hero.critRate + eqCrit);
            let finalDmg = isCrit ? Math.floor(totalAtk * 1.5) : totalAtk;
            m.hp -= finalDmg;

            if (isCrit) {
                log(`<span class="txt-gold">⚡ 觸發【暴擊】！對 ${m.name} 造成了 <b>${finalDmg}</b> 點傷害！</span>`);
            } else {
                log(`<span class="txt-blue">你</span> 發動攻擊，造成 <b>${finalDmg}</b> 點傷害。`);
            }

            if (hero.equippedWeapon && hero.equippedWeapon.trait.code === "vamp") {
                let vampHeal = Math.floor(finalDmg * 0.15);
                hero.hp = Math.min(hero.maxHp, hero.hp + vampHeal);
                log(`<span class="txt-green">🩸 觸發【嗜血吸魂】特性，恢復了 ${vampHeal} 生命值！</span>`);
            }

            if (hero.equippedWeapon && hero.equippedWeapon.trait.code === "burn" && Math.random() < 0.3) {
                m.burn += 2;
                log(`<span class="txt-red">🔥 觸發【熾熱烈焰】特性，引燃敵人 2 回合！</span>`);
            }

            if (checkBattleStatus()) return;

            let mDmg = m.atk;
            if (hero.shield > 0) {
                if (hero.shield >= mDmg) {
                    hero.shield -= mDmg;
                    log(`<span class="txt-blue">🛡️ 護盾抵擋了 ${mDmg} 點傷害！</span>`);
                    mDmg = 0;
                } else {
                    mDmg -= hero.shield;
                    hero.shield = 0;
                    log(`<span class="txt-blue">🛡️ 護盾破裂！</span>`);
                }
            }

            if (mDmg > 0) {
                hero.hp -= mDmg;
                log(`<span class="txt-red">${m.name}</span> 對你造成 <b>${mDmg}</b> 點傷害。`);
            }

            updateUI();
            if (checkBattleStatus()) return;

            round++;
        }, 1200);
    }

    function checkBattleStatus() {
        if (!currentMonster) return false;

        if (hero.hp <= 0) {
            hero.hp = 0; updateUI();
            log(`<span class="txt-red">💀 戰鬥失敗... 挑戰不成功。</span>`);
            endBattle();
            return true;
        }

        if (currentMonster.hp <= 0) {
            currentMonster.hp = 0; updateUI();
            let expGained = currentMonster.isBoss ? 120 : 45;
            let goldGained = currentMonster.isBoss ? 250 : 75;

            log(`<span class="txt-green">🎉 戰鬥勝利！獲得 ${expGained} EXP 與 ${goldGained} Gold！</span>`);
            hero.gold += goldGained;
            gainExp(expGained);

            if (currentMonster.isBoss) {
                stage.chapter++; stage.node = 1;
                log(`<span class="txt-gold">🏆 成功擊敗章節首領！晉級至第 ${stage.chapter} 章！</span>`);
            } else {
                stage.node++;
                if (stage.node > 5) stage.node = 5;
            }

            endBattle();
            return true;
        }
        return false;
    }

    function gainExp(amount) {
        hero.exp += amount;
        if (hero.exp >= hero.maxExp) {
            hero.level++;
            hero.exp -= hero.maxExp;
            hero.maxExp = Math.floor(hero.maxExp * 1.3);
            hero.maxHp += 35;
            hero.baseAtk += 6;
            log(`<span class="txt-gold">🌟 等級提升！晉級至 Lv.${hero.level}！</span>`);
        }
    }

    function endBattle() {
        clearInterval(battleTimer);
        battleTimer = null;
        inBattle = false;
        currentMonster = null;
        updateUI();
    }

    function updateSkillCDUI() {
        skills.forEach(s => {
            let cdBox = document.getElementById(`cd-${s.id}`);
            let btn = document.getElementById(`sk-${s.id}`);
            if (s.currentCd > 0) {
                cdBox.style.display = 'flex';
                cdBox.innerText = s.currentCd;
                btn.disabled = true;
            } else {
                cdBox.style.display = 'none';
                btn.disabled = false;
            }
        });
    }

    function updateUI() {
        document.getElementById('p-level').innerText = `Lv.${hero.level}`;
        document.getElementById('p-hp-sta').innerText = `HP: ${Math.max(0, hero.hp)}/${hero.maxHp} ${hero.shield > 0 ? '(🛡️' + hero.shield + ')' : ''} | STA: ${hero.sta}/${hero.maxSta}`;
        document.getElementById('p-exp-gold').innerText = `EXP: ${hero.exp}/${hero.maxExp} | 金幣: ${hero.gold}G | 關卡: ${stage.chapter}-${stage.node}`;
    }

    function log(msg) {
        const l = document.getElementById('log');
        l.innerHTML += msg + "<br>";
        l.scrollTop = l.scrollHeight;
    }

    // 初始化執行
    changeRandomBackground();
    renderCarousel();
    resetCarouselTimer();
    updateUI();
</script>

</body>
</html>
